<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loggix AI | Voice Support</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --brand-blue: #0061FF;
            --brand-glow: rgba(0, 97, 255, 0.4);
            --bg-dark: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 97, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 97, 255, 0.05) 0%, transparent 50%);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            width: 1000px;
            max-width: 95%;
            height: 600px;
            z-index: 10;
        }

        /* 3D Agent Island */
        .agent-island {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            transform-style: preserve-3d;
            transform: rotateX(5deg) rotateY(-5deg);
            box-shadow: 
                -20px 20px 50px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,255,255,0.05);
            transition: transform 0.5s ease;
        }

        .agent-island:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        .core-3d-wrap {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .core-3d {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, var(--brand-blue), #003087);
            border-radius: 50%;
            position: relative;
            z-index: 5;
            box-shadow: 0 0 60px var(--brand-glow);
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .ring-3d {
            position: absolute;
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        .ring-1 { width: 180px; height: 180px; border-top-color: var(--brand-blue); animation: spin 3s linear infinite; }
        .ring-2 { width: 220px; height: 220px; border-right-color: var(--brand-blue); animation: spin 5s linear infinite reverse; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .active .core-3d {
            background: radial-gradient(circle at 30% 30%, #10b981, #065f46);
            box-shadow: 0 0 80px rgba(16, 185, 129, 0.5);
        }

        .active .ring-3d { border-color: rgba(16, 185, 129, 0.2); }

        /* Transcript Panel */
        .transcript-island {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            height: 100%; /* Fix height to match grid */
            box-shadow: 10px 10px 30px rgba(0,0,0,0.3);
            overflow: hidden; /* Prevent child overflow */
        }

        .panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brand-blue);
            margin-bottom: 1.5rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        #transcript-stream {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            mask-image: linear-gradient(to bottom, transparent, black 10%);
        }

        #transcript-stream::-webkit-scrollbar {
            width: 4px;
        }

        #transcript-stream::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .line {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            color: #94a3b8;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .line b { color: white; display: block; font-size: 0.7rem; margin-bottom: 2px; text-transform: uppercase; }

        /* Single Control Button */
        .btn-wrap {
            width: 100%;
            margin-top: auto;
        }

        .btn-3d {
            width: 100%;
            padding: 1.25rem;
            border-radius: 20px;
            border: none;
            background: var(--brand-blue);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0, 97, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-3d:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 97, 255, 0.5);
        }

        .btn-3d:active { transform: translateY(0) scale(0.98); }

        .btn-3d.active {
            background: #ef4444;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .brand-header {
            margin-top: 2rem;
            text-align: center;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* 3D Background Objects */
        .floating-obj {
            position: fixed;
            background: linear-gradient(135deg, var(--brand-blue), transparent);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="floating-obj" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
    <div class="floating-obj" style="width: 300px; height: 300px; bottom: -50px; right: -50px; opacity: 0.1;"></div>

    <div class="layout-grid">
        <!-- Agent Island -->
        <div id="agent-card" class="agent-island">
            <div class="brand-header" style="margin-top: 0; margin-bottom: 2rem;">
                <h1 class="brand-name">LOGGIX AI</h1>
                <p class="brand-sub">Voice Support Portal</p>
            </div>

            <div class="core-3d-wrap">
                <div class="ring-3d ring-1"></div>
                <div class="ring-3d ring-2"></div>
                <div id="ai-core" class="core-3d"></div>
            </div>

            <div class="btn-wrap">
                <button id="main-btn" class="btn-3d">
                    <span id="btn-icon">⚡</span>
                    <span id="btn-text">Connect to Support</span>
                </button>
                <p id="status-text" style="margin-top: 1rem; font-size: 0.75rem; color: #64748b; font-weight: 600;">ENCRYPTED CHANNEL SECURE</p>
            </div>
        </div>

        <!-- Transcript Island -->
        <div class="transcript-island">
            <div class="panel-title">Conversation Logs</div>
            <div id="transcript-stream">
                <!-- Chat lines here -->
            </div>
        </div>
    </div>

    <!-- Vapi SDK -->
    <script>
        (function (d, t) {
            var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
            g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            g.defer = true; g.async = true;
            s.parentNode.insertBefore(g, s);
            g.onload = () => initVapi();
        })(document, "script");

        function initVapi() {
            const btn = document.getElementById('main-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const agentCard = document.getElementById('agent-card');
            const core = document.getElementById('ai-core');
            const stream = document.getElementById('transcript-stream');
            const status = document.getElementById('status-text');

            const publicKey = "a15e4ada-0005-4628-9ec0-d4761e080cb4";
            const assistantId = "cdc4601d-364c-4d0a-a515-d4d39feb9fa6";

            let vapiInstance = null;
            let active = false;

            btn.addEventListener('click', () => {
                if (!active) {
                    startCall();
                } else {
                    stopCall();
                }
            });

            function startCall() {
                btnText.innerText = "Establishing...";
                btn.disabled = true;

                vapiInstance = window.vapiSDK.run({
                    apiKey: publicKey,
                    assistant: assistantId,
                    config: { button: { display: "none" } }
                });

                vapiInstance.on('call-start', () => {
                    active = true;
                    btn.disabled = false;
                    btn.classList.add('active');
                    agentCard.classList.add('active');
                    btnText.innerText = "End Support Session";
                    btnIcon.innerText = "✕";
                    status.innerText = "LIVE CONNECTION ACTIVE";
                    status.style.color = "#10b981";
                });

                vapiInstance.on('call-end', () => resetUI());
                vapiInstance.on('message', (m) => {
                    if (m.type === 'transcript' && m.transcriptType === 'final') {
                        const div = document.createElement('div');
                        div.className = 'line';
                        const isAI = m.role !== 'user';
                        div.innerHTML = `<b>${isAI ? 'Agent' : 'You'}</b> ${m.transcript}`;
                        stream.appendChild(div);
                        stream.scrollTop = stream.scrollHeight;
                    }
                });
                vapiInstance.on('error', (e) => { console.error(e); resetUI(); });
            }

            function stopCall() { if (vapiInstance) { vapiInstance.stop(); resetUI(); } }

            function resetUI() {
                active = false;
                btn.disabled = false;
                btn.classList.remove('active');
                agentCard.classList.remove('active');
                btnText.innerText = "Connect to Support";
                btnIcon.innerText = "⚡";
                status.innerText = "ENCRYPTED CHANNEL SECURE";
                status.style.color = "#64748b";
            }
        }
    </script>
</body>
</html>
